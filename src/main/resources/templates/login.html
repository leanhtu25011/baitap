<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 400px; border-radius: 10px;">
        <h3 class="text-center mb-4 text-primary">ĐĂNG NHẬP</h3>
        
        <!-- Hiển thị thông báo lỗi nếu sai mật khẩu -->
        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập:</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập username..." required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Mật khẩu:</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập password..." required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">ĐĂNG NHẬP</button>
        </form>
    </div>

</body>
</html>
