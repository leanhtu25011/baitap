<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Quản Lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Thanh Menu Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">HỆ THỐNG QUẢN LÝ TỔNG HỢP</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" th:text="'Xin chào, ' + ${session.currentUser.hoTen}">Xin chào, Admin</span>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <!-- Khu vực thẻ chức năng -->
    <div class="container mt-5">
        <h2 class="text-center mb-5 text-secondary">BẢNG ĐIỀU KHIỂN (DASHBOARD)</h2>
        <div class="row justify-content-center gap-4">
            
            <!-- Thẻ Quản lý Sinh viên -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-primary">
                    <div class="card-body text-center p-4">
                        <h4 class="card-title text-primary mb-3">Quản Lý Sinh Viên</h4>
                        <p class="card-text text-muted mb-4">Xem danh sách, thêm, sửa, xóa hồ sơ thông tin sinh viên.</p>
                        <a th:href="@{/sinhvien}" class="btn btn-primary w-100 fw-bold">TRUY CẬP</a>
                    </div>
                </div>
            </div>

            <!-- Thẻ Quản lý Lớp học (Dành cho chức năng tiếp theo) -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-success">
                    <div class="card-body text-center p-4">
                        <h4 class="card-title text-success mb-3">Quản Lý Lớp Học</h4>
                        <p class="card-text text-muted mb-4">Thiết lập chuyên ngành, mã lớp và thông tin đào tạo.</p>
                        <button class="btn btn-success w-100 fw-bold" disabled>SẮP RA MẮT</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
