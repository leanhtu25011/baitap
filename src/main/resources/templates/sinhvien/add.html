<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm mới sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">THÊM MỚI HỒ SƠ SINH VIÊN</h5>
        </div>
        <div class="card-body">
            <!-- Form đẩy dữ liệu POST về /sinhvien/save -->
            <form th:action="@{/sinhvien/save}" th:object="${sinhVien}" method="post">
                <div class="mb-3">
                    <label class="form-label">Mã sinh viên (*):</label>
                    <input type="text" class="form-control" th:field="*{maSV}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Họ và tên (*):</label>
                    <input type="text" class="form-control" th:field="*{hoTen}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ngày sinh (*):</label>
                    <input type="date" class="form-control" th:field="*{ngaySinh}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Giới tính (*):</label>
                    <select class="form-select" th:field="*{gioiTinh}">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Lớp học chuyên ngành (*):</label>
                    <select class="form-select" th:field="*{lopHoc.id}" required>
                        <option value="">-- Chọn lớp học --</option>
                        <option th:each="lop : ${listLopHoc}" th:value="${lop.id}" th:text="${lop.tenLop}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email sinh viên (*):</label>
                    <input type="email" class="form-control" th:field="*{email}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Điểm trung bình:</label>
                    <input type="number" step="0.1" class="form-control" th:field="*{diemTB}">
                </div>
                
                <div class="mt-4 text-end">
                    <a th:href="@{/sinhvien}" class="btn btn-outline-secondary me-2">Quay lại</a>
                    <button type="submit" class="btn btn-dark">Lưu Thông Tin</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
