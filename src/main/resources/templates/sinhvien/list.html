<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>QUẢN LÝ DANH SÁCH SINH VIÊN</h2>
        <div>
            <!-- Nút thêm mới chỉ hiện cho ADMIN -->
            <a th:if="${session.currentUser != null and session.currentUser.role == 'ADMIN'}" th:href="@{/sinhvien/add}" class="btn btn-dark">+ Thêm sinh viên mới</a>
            <a th:href="@{/}" class="btn btn-secondary">Trang chủ</a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered table-hover align-middle text-center">
        <thead class="table-light">
            <tr>
                <th>STT</th><th>MÃ SV</th><th>HỌ VÀ TÊN</th><th>NGÀY SINH</th>
                <th>GIỚI TÍNH</th><th>EMAIL</th><th>ĐIỂM TB</th>
                <!-- Cột THAO TÁC chỉ hiện cho ADMIN -->
                <th th:if="${session.currentUser != null and session.currentUser.role == 'ADMIN'}">THAO TÁC</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sv, iterStat : ${listSinhVien}">
                <td th:text="${iterStat.count}">1</td>
                <td th:text="${sv.maSV}">20012341</td>
                <td th:text="${sv.hoTen}">Nguyễn Văn An</td>
                <td th:text="${sv.ngaySinh}">15/03/2004</td>
                <td th:text="${sv.gioiTinh}">Nam</td>
                <td th:text="${sv.email}">an.nguyen@student.iuh.edu.vn</td>
                <td th:text="${sv.diemTB}">8.25</td>
                <!-- Nút Sửa/Xóa chỉ hiện cho ADMIN -->
                <td th:if="${session.currentUser != null and session.currentUser.role == 'ADMIN'}">
                    <a th:href="@{/sinhvien/edit/{id}(id=${sv.id})}" class="btn btn-outline-primary btn-sm">Sửa</a>
                    <a th:href="@{/sinhvien/delete/{id}(id=${sv.id})}" class="btn btn-outline-danger btn-sm"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này khỏi hệ thống?');">Xóa</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listSinhVien)}">
                <td colspan="8" class="text-center text-muted">Chưa có dữ liệu sinh viên.</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
